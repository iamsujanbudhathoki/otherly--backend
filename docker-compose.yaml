version: '3.9'

services:
  app:
    build: .
    container_name: otherly_api
    restart: always
    ports:
      - '127.0.0.1:4000:4000'
    env_file:
      - .env
    environment:
      PORT: 4000
      NODE_ENV: PRODUCTION
      DATABASE_URL: postgresql://postgres:postgres@db:5432/otherly_marketplace
      DB_SSL: 'false'
      DB_SYNCHRONIZE: 'true'
      BASE_URL: https://otherly-api.bombaybara.ca
    volumes:
      - ./.env:/app/.env:ro
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: otherly_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: otherly_marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d otherly_marketplace']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads_data:
